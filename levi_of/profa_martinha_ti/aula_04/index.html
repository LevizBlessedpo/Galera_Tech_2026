<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divs - posicionamento absoluto</title>
    <style>

        .a {
            width: 200px; 
            height: 200px;
            background-color: lime;
            position: absolute;
            top: 0;
            left: 0;
        }

        .b {
            background-color: firebrick;
            width: 200px; 
            height: 200px;
            position: absolute;
            top: 100px;
            left: 100px;
            z-index: 1;
        }
        .b:hover { 
            rotate: 71deg; 
            background-color: hotpink;
            width: 300px;
            height: 300px;
            cursor: pointer;
            border-radius: 30px;
            box-shadow: 5px 5px 5px red;
            animation: mover 5s infinite;
        }
        @keyframes mover {
                from {
                    rotation: 0deg;
                }

                to {
                    rotate: 360deg;
                }
        }
        img {
            border-radius: 10px 20px 30px;
        }
        .c {
            background-color: purple;
            width: 200px; 
            height: 200px;
            position: absolute;
            top: 200px;
            left: 200px;
        }

        .d {
            background-color: red;
            width: 200px; 
            height: 200px;
            position: absolute;
            top: 300px;
            left: 300px;
        }

        .e {
            background-color:gold;
            width: 200px; 
            height: 200px;
            position: absolute;
            top: 400px;
            left: 400px;
        }
    </style>
</head>
<body>
    <div class="a">div1</div>
    <div class="b">
        <img src="67.jpg" alt="sessenta e sete" width="300px" height="300px">
    </div>
    <div class="c">div3</div>
    <div class="d">div4</div>
    <div class="e">div5</div>
</body>
</html>
