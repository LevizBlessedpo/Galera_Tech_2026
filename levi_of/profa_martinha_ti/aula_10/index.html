<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid System Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .col {
            border: 1px solid #222222;
        }
        .col-3, .col-6 {
            border: 1px solid #222222;
        }
        .col-4 {
            border: 1px solid #222222;
        }
    </style>
</head>

<body>
    <div class="container text-center">
        <div class="row"> <!-- row significa linha dentro do bootstrp-->
            <div class="col-9" style="border: 1px solid #222222"> <!-- col siginifica a coluna, sempre tem que somar 12 ao todo -->
                Column 1
            </div>
            <div class="col">
                Column 2
            </div>
            <div class="col">
                Column 3
            </div>
            <div class="col">
                Column 4
            </div>
        </div>
        <div class="row">
            <div class="col-6">Coluna 1</div>
            <div class="col-6">Coluna 2</div>
        </div>
        <div class="row">
            <div class="col-4">Coluna 1</div>
            <div class="col-4">Coluna 2</div>
            <div class="col-4">Coluna 3</div>
        </div>
        <div class="row">
            <div class="col-3">Col 3</div>
            <div class="col-6">Col 6</div>
            <div class="col-3">Col 3</div>
        </div>
    </div>
    <hr>
    <div class="container-fluid">
        <p style="text-align: center;">Container fluído</p>
        <div class="row">
            <div class="col-6" style="border: 1px solid #222222;">Coluna 1</div>
            <div class="col-6" style="border: 1px solid #222222;">Coluna 2</div>
        </div>
    </div>
</body>

</html>
