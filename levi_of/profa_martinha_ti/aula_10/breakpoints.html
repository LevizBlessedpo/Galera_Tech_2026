<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakpoints Bootstrap</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <style>
            div {
                border: 1px groove #8616e2;
            }
        </style>
</head>
<body>
    <h1> COL SM - small</h1>
    <div class="container text-center">
        <div class="row">
            <div class="col-sm">Coluna 1 SM </div>
            <div class="col-sm">Coluna 2 SM </div>
            <div class="col-sm">Coluna 3 SM </div>
        </div>
    </div>
    <h1> COL MD - medium</h1>
    <div class="container text-center">
        <div class="row">
            <div class="col-md">Coluna 1 MD </div>
            <div class="col-md">Coluna 2 MD </div>
            <div class="col-md">Coluna 3 MD </div>
        </div>
    </div>
    <h1> COL LG - large</h1>
    <div class="container text-center">
        <div class="row">
            <div class="col-lg">Coluna 1 LG </div>
            <div class="col-lg">Coluna 2 LG </div>
            <div class="col-lg">Coluna 3 LG </div>
        </div>
    </div>
    <h1> COL XL - Extra large</h1>
    <div class="container text-center">
        <div class="row">
            <div class="col-xl">Coluna 1 XL </div>
            <div class="col-xl">Coluna 2 XL </div>
            <div class="col-xl">Coluna 3 XL </div>
        </div>
    </div>
    <h1> COL XXL - Extra Extra large</h1>
    <div class="container text-center">
        <div class="row">
            <div class="col-xl">Coluna 1 XXL </div>
            <div class="col-xl">Coluna 2 XXL </div>
            <div class="col-xl">Coluna 3 XXL </div>
        </div>
    </div>
</body>
</html>
