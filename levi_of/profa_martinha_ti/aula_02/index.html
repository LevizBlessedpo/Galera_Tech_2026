<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links e Imagens</title>
    <style>
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>
    <a href="#" id="topo"></a>
    <h1>Imagem da Web</h1>
    <!-- Acessibilidade atributo <alt> -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/61/HTML5_logo_and_wordmark.svg?utm_source=pt.wikipedia.org&utm_campaign=index&utm_content=original" alt="texto alternativo da imagem" width="200px">
    <!-- Imagem dentro de um paragráfo -->
    <p>
        <img src="https://i.pinimg.com/736x/97/53/0e/97530e4c71a55b9630fef85e67e0f9f7.jpg" alt="absolute cinema" width="200px">
        <img src="https://i.pinimg.com/236x/dd/d4/87/ddd48732cfce77ed1157b767db644522.jpg" alt="linux zuera" width="180px">
        <p>
            <img src="https://i.redd.it/5702bqeb3ubf1.png" alt="RESENHA" width="300px">   
        </p>
        <p>
            <img src="img/thinkaboutit-smart.gif" alt="pense bem" width="20%">
        </p>
        <p>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/BLO-FHZG3Zg?si=0DDgni86vTPAR058"   
                title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </p>
        <hr>
        <h1> Links </h1>
        <!-- estrutura simples de um link -->
         <a href="https://youtu.be/BLO-FHZG3Zg?si=nzBnQfXIufPKElRy" 
         target="_blank">Assitir video no youtube</a>

        <!-- desafio -->
         <!-- como abrir um link clicando em uma imagem?-->
        <p>Abrindo um <strong>link com uma imagem!</strong></p>
        <p>
            <a href="https://youtu.be/BLO-FHZG3Zg?si=nzBnQfXIufPKElRy" 
              target="_blank"> 
                <img src="https://i.redd.it/5702bqeb3ubf1.png" alt="RESENHA" width="300px">
            </a>
        </p>

        <p>Abrindo a <strong>imagem com uma imagem!</strong></p>
        <p>
            <a href="img/absolute cinema.jpg" 
              target="_blank"> 
                <img src="img/absolute cinema.jpg" alt="RESENHA" width="300px">
            </a>
        </p>
        <p>Abrindo um <strong>site com imagem!</strong></p>
        <p>
            <a href="https://www.sp.senac.br/" 
              target="_blank"> 
                <img src="img/pinguim do linuc doido.jpg" alt="RESENHA" width="300px">
            </a>
        </p>
        <p>
            <a href="#topo">
                <img src="img/setinha.png" width="10%">
            </a>
        </p>
    </p> 
</body>
</html>
